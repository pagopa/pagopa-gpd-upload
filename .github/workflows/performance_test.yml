name: Performance Tests

on:
  schedule:
    - cron: '00 08 25 * *'

  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Select the Environment
        options:
          - dev
          - uat
        default: dev
      type:
        required: true
        type: choice
        description: Select the test type
        options:
          - smoke
          - constant
        default: smoke
      positions-per-file:
        required: true
        type: number
        description: The number of debt positions each test file will contain
        default: 1
      file-number:
          required: true
          type: number
          description: The number of test file
          default: 1
      lifetime:
        required: true
        type: number
        description: Test duration in minutes
        default: 1
      iteration-rate:
        required: true
        type: number
        description: Upload flows started per second (constant test only)
        default: 50
      canary:
        description: 'run the tests on canary version'
        required: false
        type: boolean
        default: false


permissions:
  id-token: write
  contents: read
  deployments: write


jobs:
  performance_test:
    name: Test ${{(github.event.inputs == null && 'dev') || inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{(github.event.inputs == null && 'dev') || inputs.environment }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@1f9a0c22da41e6ebfa534300ef656657ea2c6707

      - name: Prepare performance data
        shell: bash
        env:
          ITERATION_RATE: ${{ inputs.iteration-rate }}
        run: |
          cd ./performance-test
          chmod +x ./prepare_performance_data.sh
          ./prepare_performance_data.sh ${{inputs.file-number}} ${{inputs.positions-per-file}}
          export BASE_PATH=./src/test-types
          jq --arg type "${{inputs.type}}" \
            --arg duration "${{inputs.lifetime}}m" \
            --argjson iteration_rate "$ITERATION_RATE" \
            '.scenarios.contacts.duration = $duration |
            if $type == "constant" then
              .scenarios.contacts.timeUnit = "1s" |
              .scenarios.contacts.rate = $iteration_rate
            else
              .scenarios.contacts.timeUnit = $duration
            end' \
            ${BASE_PATH}/${{inputs.type}}.json > temp.json && mv temp.json ${BASE_PATH}/${{inputs.type}}.json
 
      - name: Run k6 local test
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # v0.3.1
        with:
          filename: performance-test/src/main_scenario.js
          flags: --env VARS=environments/${{inputs.environment}}.environment.json --env TEST_TYPE=./test-types/${{inputs.type}}.json
        env:
          API_SUBSCRIPTION_KEY: ${{ secrets.SUBKEY }}
          FILE_NUMBER: ${{inputs.file-number}}
